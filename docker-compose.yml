name: oviapp

services:
  db:
    image: postgres:16-alpine
    container_name: oviapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: oviapp
      POSTGRES_PASSWORD: oviapp
      POSTGRES_DB: oviapp
    ports:
      - "5433:5432"
    volumes:
      - oviapp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oviapp -d oviapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Base exclusiva de la suite de pruebas. `tests/apoyo/setupGlobal.ts` la
  # espera en el 5434 y se niega a correr si DATABASE_URL no dice "test", asi
  # que no hay riesgo de que la suite toque la base de desarrollo.
  db-test:
    image: postgres:16-alpine
    container_name: oviapp-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: oviapp
      POSTGRES_PASSWORD: oviapp
      POSTGRES_DB: oviapp_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oviapp -d oviapp_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sin `ports:` a proposito. MediaMTX no tiene autenticacion propia, asi que
  # publicar el 8888 (HLS) o el 8554 (RTSP) dejaria el video al alcance de
  # cualquiera en la red del predio, sin pasar por el login. Los demas
  # contenedores lo siguen alcanzando por la red interna como `mediamtx:8888`,
  # y la app llega al video por el proxy autenticado /api/v1/streaming.
  #
  # Para depurar con VLC o ffplay, crear un docker-compose.override.yml local
  # que vuelva a publicar esos puertos (ver streaming/README.md).
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: oviapp-streamer
    restart: unless-stopped
    volumes:
      - ./streaming/mediamtx.yml:/mediamtx.yml

  camara_mock:
    image: linuxserver/ffmpeg:latest
    container_name: oviapp-camara-mock
    restart: unless-stopped
    volumes:
      - ./videos:/videos
    depends_on:
      mediamtx:
        condition: service_started
    entrypoint: >
      ffmpeg -re -stream_loop -1 -i /videos/rebano.mp4 -c copy -f rtsp rtsp://mediamtx:8554/rebano

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oviapp-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://oviapp:oviapp@db:5432/oviapp?schema=public
      DB_POOL_MAX: 10
      # Se toma del entorno del host (o de un .env junto a este archivo). El
      # valor por defecto sirve solo para desarrollo local: en despliegue hay
      # que exportar JWT_SECRET con un secreto generado (RNF_03).
      JWT_SECRET: "${JWT_SECRET:-desarrollo-local-cambiar-en-produccion-min-32-chars}"
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL_DIAS: 30
      BCRYPT_ROUNDS: 12
      CORS_ORIGINS: "*"
      # El backend es el unico que habla con MediaMTX: le hace de proxy al video
      # para que el puerto del streamer no quede expuesto sin autenticacion.
      MEDIAMTX_URL_INTERNO: "http://mediamtx:8888"
      LOG_LEVEL: info
      PUSH_HABILITADO: "false"
      FIREBASE_CREDENCIALES_JSON: ""
      CRON_HABILITADO: "false"
      CRON_RECORDATORIOS: "0 8 * * *"
    depends_on:
      db:
        condition: service_healthy
      mediamtx:
        condition: service_started
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  # ───────────────────────────────────────────────────────────────────────────
  # Modulo de vision por computadora.
  #
  # Va en el perfil "ia" y NO arranca con un `docker compose up` normal porque
  # la imagen base de CUDA pesa varios GB y reserva una GPU NVIDIA.
  #
  # Para levantarlo:  docker compose --profile ia up -d ia-engine
  # ───────────────────────────────────────────────────────────────────────────
  ia-engine:
    profiles: ["ia"]
    build:
      context: ./ia-engine
      dockerfile: Dockerfile
    container_name: oviapp-ia-engine
    restart: unless-stopped
    environment:
      BACKEND_URL: "http://backend:3000"
      # Debe coincidir con la key del dispositivo en la tabla dispositivo_edge.
      # La que genera el seed es edge_hatonorte.7f3a91c4e08b45d2a6f1
      EDGE_API_KEY: "${EDGE_API_KEY:-edge_hatonorte.7f3a91c4e08b45d2a6f1}"
      RTSP_STREAMS: "rebano=rtsp://mediamtx:8554/rebano"
      # sheep_detection.pt es un detector de una sola clase ("sheep"). Sobre
      # rebano.mp4 a 0.35 cuenta 17-22 ovejas por frame, contra 7-13 del
      # preentrenado COCO yolo26n.pt, que queda en models/ como respaldo.
      MODEL_PATH: "/app/models/sheep_detection.pt"
      # Clases a contar. Con el modelo de una sola clase el filtro no cambia
      # nada, pero se deja para que volver a yolo26n (80 clases COCO) no sume
      # personas, perros y vehiculos. Vacio = contar todas las detecciones.
      CLASES_OBJETIVO: "sheep"
      FPS_PROCESAMIENTO: 2
      # Ventanas de 640 px por frame, para no perder las ovejas lejanas al
      # reducir el video. 0 = analizar el frame completo (menos carga).
      TILE_INFERENCIA: 640
      HEARTBEAT_INTERVALO_SEG: 60
      # Bajado de 0.5: el diagnostico (ia-engine/scripts/diagnostico_conteo.py)
      # mostro que 0.5 descarta casi la mitad de las ovejas reales del video
      # de prueba (84 vs 146 detecciones sobre los mismos frames a 0.25). El
      # filtro de clases "sheep" no influye (0 detecciones de otras clases en
      # este video), asi que la ganancia real esta en el umbral, no en CLASES_OBJETIVO.
      CONFIANZA_MINIMA: 0.35
      # El conteo esperado se lee de GET /edge/configuracion. Definir
      # CONTEO_ESPERADO aqui solo sirve como respaldo si el backend no responde.
    depends_on:
      mediamtx:
        condition: service_started
      backend:
        condition: service_started
    # Reserva de GPU NVIDIA. El Detector cae a CPU por su cuenta si CUDA no
    # esta disponible, pero esta reserva impide que el contenedor arranque en
    # una maquina sin GPU: comentar este bloque para correr en CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


volumes:
  oviapp-db-data: