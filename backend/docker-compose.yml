name: oviapp

services:
  db:
    image: postgres:16-alpine
    container_name: oviapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: oviapp
      POSTGRES_PASSWORD: oviapp
      POSTGRES_DB: oviapp
    ports:
      # 5433 en el host para no chocar con un PostgreSQL instalado localmente.
      - '5433:5432'
    volumes:
      - oviapp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oviapp -d oviapp']
      interval: 5s
      timeout: 5s
      retries: 10

  # Base efimera para la suite de tests (no persiste volumen).
  db-test:
    image: postgres:16-alpine
    container_name: oviapp-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: oviapp
      POSTGRES_PASSWORD: oviapp
      POSTGRES_DB: oviapp_test
    ports:
      - '5434:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oviapp -d oviapp_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oviapp-db-data:
